apiVersion: v1
kind: Pod
metadata:
  name: test-gomemlimit-pod
  namespace: default
  annotations:
    gomemlimit.aooba.net/inject: "true"
    gomemlimit.aooba.net/ratio: "0.85"
    gomemlimit.aooba.net/gogc: "150"
spec:
  restartPolicy: Never
  containers:
    - name: test-app
      image: alpine:latest
      command: ["sh", "-c", "env | grep -E 'GOMEMLIMIT|GOGC' && sleep 3600"]
      resources:
        limits:
          memory: "256Mi"
          cpu: "200m"
