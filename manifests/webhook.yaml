apiVersion: v1
kind: Namespace
metadata:
  name: gomemlimit-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gomemlimit-webhook
  namespace: gomemlimit-system
  labels:
    app.kubernetes.io/name: gomemlimit-webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gomemlimit-webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gomemlimit-webhook
    spec:
      containers:
        - name: webhook
          image: ghcr.io/aobaiwaki123/gomemlimit-webhook:latest
          imagePullPolicy: IfNotPresent
          args:
            - "-auto-cert=false"
            - "-tls-cert-file=/etc/webhook/certs/tls.crt"
            - "-tls-key-file=/etc/webhook/certs/tls.key"
            - "-port=8443"
          volumeMounts:
            - name: webhook-certs
              mountPath: /etc/webhook/certs
              readOnly: true
          ports:
            - containerPort: 8443
              name: https
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: webhook-certs
          secret:
            secretName: gomemlimit-webhook-tls
---
apiVersion: v1
kind: Service
metadata:
  name: gomemlimit-webhook
  namespace: gomemlimit-system
spec:
  ports:
    - port: 443
      targetPort: 8443
      name: https
  selector:
    app.kubernetes.io/name: gomemlimit-webhook
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: gomemlimit-mutating-webhook
webhooks:
  - name: gomemlimit.aooba.net
    admissionReviewVersions: ["v1"]
    sideEffects: None
    timeoutSeconds: 5
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
        scope: "Namespaced"
    clientConfig:
      service:
        name: gomemlimit-webhook
        namespace: gomemlimit-system
        path: /mutate
      caBundle: ${CA_BUNDLE}
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system", "gomemlimit-system"]
